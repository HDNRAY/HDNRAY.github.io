    <title>ColorGuess · 混色三选一</title>
    <!-- Boot splash: the theme CSS variables only exist under .app-theme--*
         which requires JS, so without this the document paints white while
         the bundle downloads. A tiny inline script themes <html> pre-JS and
         Layout.tsx clears it (and removes the splash) once React is up. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash::after {
        content: "";
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(22, 24, 29, 0.14);
        border-top-color: #4f46e5;
        animation: dsw-boot-spin 0.8s linear infinite;
      }
      html.dsw-boot--dark #boot-splash::after {
        border-color: rgba(236, 238, 242, 0.16);
        border-top-color: #818cf8;
      }
      @keyframes dsw-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        var dark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var color = dark ? "#0f1115" : "#f4f5f7";
        var root = document.documentElement;
        root.style.background = color;
        root.classList.add(dark ? "dsw-boot--dark" : "dsw-boot--light");
      })();
    </script>
    <!-- Umami analytics (H5 only; the weapp build does not use index.html).
         data-auto-track also records SPA route changes (game -> results). -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="ce8ced3f-1741-4d09-9376-c1378950c2a4"
      data-auto-track="true"
    ></script>
    <script type="module" crossorigin src="/colorguess/js/app.8788972b.js"></script>
    <link rel="modulepreload" crossorigin href="/colorguess/js/vendors.c36067e4.js">
    <link rel="stylesheet" href="/colorguess/css/vendors.f699ec46.css">
    <link rel="stylesheet" href="/colorguess/css/index.dc0eb9de.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" aria-hidden="true"></div>
    <script>!function(n){function f(){var e=n.document.documentElement,r=e.getBoundingClientRect(),width=r.width,height=r.height,arr=[width,height].filter(function(value){return Boolean(value)}),w=Math.min.apply(Math,arr),x=40*w/750;e.style.fontSize=x>=40?"40px":x<=20?"20px":x+"px"}; n.addEventListener("resize",(function(){f();setTimeout(f,500)})),f()}(window);</script>
  
  </body>
