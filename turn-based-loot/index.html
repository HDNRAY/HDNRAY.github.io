<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>时空特工</title>
    <meta name="theme-color" content="#07070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="时空特工" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      /* iOS 加到主屏幕后状态栏/刘海会盖住 canvas 顶部：把安全区交给引擎布局，
         游戏内仍全部由 framebuffer 绘制，这里只提供一个数值。 */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        height: 100dvh;
        background: #07070c;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        background: #07070c;
      }
    </style>
    <script type="module" crossorigin src="./assets/main-BsUvyMvR.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/effect-C7bFAvnQ.js">
    <link rel="modulepreload" crossorigin href="./assets/actors-Ca2sOKDJ.js">
  </head>
  <body>
    <canvas id="game"></canvas>
    <!--
      系统键盘桥：起名页点输入区时 focus 这个隐藏 input，手机上会调起系统
      输入法（支持中文 IME），PC 上直接接物理键盘。DOM 只负责输入，
      不参与任何视觉——名字始终由 canvas 绘制（见 src/game/name-input.ts）。
    -->
    <input
      id="name-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="done"
      aria-label="角色名字"
      style="position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px"
    />
  </body>
</html>
