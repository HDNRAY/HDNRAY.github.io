<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生成工具 · 时间特工</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d14;
        --panel: #141824;
        --line: #242b3d;
        --text: #dbe4f5;
        --dim: #7f8ca8;
        --accent: #6ec8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 14px;
      }
      h1 { font-size: 20px; margin: 0; }
      .hint { color: var(--dim); font-size: 12px; }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.active { border-color: var(--accent); color: var(--accent); background: #16202e; }
      #tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .paths {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .card canvas:not(.icon) { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      .map-grid { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
      .map-grid .card canvas:not(.icon) { image-rendering: auto; }
      .map-grid .stat-row { flex-wrap: wrap; }
      .map-grid .stat-cell { flex: 1 1 88px; min-width: 0; }
      .stat-label { color: var(--dim); font-size: 10px; }
      .meta, .item-card { padding: 12px 14px 14px; }
      .meta h2, .card > h2 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
      .item-card { padding: 14px; }
      .item-head { display: flex; justify-content: space-between; align-items: baseline; }
      .item-head h2 { font-size: 15px; margin: 0; }
      .energy { color: var(--accent); font-size: 12px; }
      .tags { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
      .desc, .unique p { color: var(--dim); font-size: 12px; margin: 2px 0 0; }
      .unique {
        border-left: 2px solid var(--accent);
        padding-left: 8px;
        margin: 10px 0;
      }
      .unique strong { font-size: 12px; color: #ffd28a; }
      .affixes, .passives { margin: 8px 0 0; padding-left: 16px; color: var(--dim); font-size: 12px; }
      .rules { margin: 0 0 10px; padding-left: 16px; color: var(--dim); font-size: 12px; }
      .swatches { display: flex; gap: 3px; }
      .swatches i { width: 14px; height: 14px; border-radius: 3px; display: block; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
      .tabs { display: flex; gap: 6px; margin-top: 8px; }
      .tabs button { padding: 3px 10px; font-size: 12px; }
      .tabs button.active { border-color: var(--accent); color: var(--accent); }
      .stat-row { display: flex; gap: 8px; margin-top: 10px; }
      .stat-cell {
        flex: 1;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
      }
      .stat-danger { color: var(--dim); font-size: 10px; }
      /* 技能页顶部总览：4 列 × 2 行，紧凑不抢首屏 */
      .skill-overview { display: flex; flex-direction: column; gap: 6px; }
      .skill-overview-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px; }
      .skill-overview-head h2 { font-size: 15px; margin: 0; }
      .skill-overview-note { color: var(--dim); font-size: 10px; }
      .skill-overview-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .overview-card {
        min-width: 0;
        padding: 6px 9px 7px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 2px solid #34435c;
        border-radius: 10px;
      }
      .overview-wide { grid-column: span 2; }
      .overview-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 4px;
        color: #aebbd4;
        font-size: 11px;
        font-weight: 600;
      }
      .overview-title b { color: var(--accent); font-size: 17px; line-height: 1; }
      .overview-metrics { display: flex; flex-wrap: wrap; gap: 3px 4px; }
      .overview-metric {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        padding: 0 5px;
        color: var(--dim);
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 10px;
        line-height: 15px;
        white-space: nowrap;
      }
      .overview-metric b { color: var(--text); font-size: 10px; font-weight: 600; }
      /* 技能页：紧凑多列，一屏 6~9 张卡 */
      .skills { display: flex; flex-direction: column; gap: 16px; }
      .domain-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 8px; }
      .domain-head h2 { font-size: 15px; margin: 0; }
      .domain-note { color: var(--dim); font-size: 11px; }
      .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 10px; }
      .skill-card {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 8px 10px 9px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 2px solid var(--accent);
        border-radius: 10px;
      }
      .skill-card[hidden] { display: none; }
      .skill-card.flash { background: #1a2740; transition: background 0.3s; }
      .skill-tags { display: flex; flex-wrap: wrap; gap: 3px; }
      .tag-chip {
        color: #e8f0ff;
        font-size: 9px;
        line-height: 14px;
        border: 1px solid transparent;
        border-radius: 4px;
        padding: 1px 5px;
        white-space: nowrap;
      }
      .tag-more { color: var(--dim); background: none; border-color: transparent; padding: 1px 2px; }
      .skill-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .skill-icon { width: 20px; height: 20px; }
      .skill-name {
        font-size: 13px;
        line-height: 18px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .skill-stats { display: flex; flex-direction: column; gap: 1px; }
      .skill-stat { color: var(--accent); font-size: 10px; line-height: 14px; }
      .skill-stat + .skill-stat { color: var(--dim); }
      /* 路径引用：一张卡只出现一次，卡片自己列出全部命中路径 */
      .skill-path-refs { color: #9fb0cc; font-size: 10px; line-height: 13px; margin: 0; }
      /* 技能页筛选 / 排序面板：单一列表，结果即时过滤 */
      .skill-filter-panel {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .skill-filter-row { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
      .skill-filter-label { color: #aebbd4; font-size: 11px; line-height: 22px; min-width: 64px; }
      .skill-filter-chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
      .filter-chip { padding: 1px 8px; font-size: 11px; line-height: 18px; border-radius: 6px; }
      .filter-chip.active { border-color: var(--accent); color: var(--accent); background: #16202e; }
      .skill-filter-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
      .skill-filter-foot .skill-filter-label { min-width: 0; }
      .skill-filter-foot select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 8px;
        font: inherit;
        font-size: 12px;
      }
      .skill-filter-count { color: var(--dim); font-size: 11px; }
      .skill-filter-reset { font-size: 11px; padding: 2px 10px; }
      .skill-filter-empty { color: var(--dim); font-size: 12px; padding: 12px 4px; margin: 0; }
      .skill-visuals { display: flex; align-items: flex-start; gap: 8px; }
      .skill-thumb { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .thumb-label { color: var(--dim); font-size: 9px; line-height: 11px; }
      .skill-desc { color: var(--dim); font-size: 10px; line-height: 14px; margin: 0; }
      .domain-card { padding-bottom: 10px; }
      .icon { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
      .skill-title { display: flex; align-items: center; gap: 6px; }
      .skill-title .icon { width: 24px; height: 24px; }
      .item-head { display: flex; align-items: center; gap: 8px; }
      .item-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
      .item-title h2 { font-size: 15px; margin: 0; }
      .item-title .tags { margin-bottom: 0; }
      .item-card .stat-row { margin: 10px 14px 0; flex-wrap: wrap; }
      .item-card .stat-cell { flex: 1 1 92px; }
      .item-card .unique { margin: 10px 14px; }
      .item-block { padding: 10px 14px 0; }
      .item-block h3 {
        font-size: 12px;
        margin: 0 0 4px;
        color: #aebbd4;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .item-block h3 span { color: var(--dim); font-weight: 400; font-size: 10px; }
      .item-card .affixes { list-style: none; padding-left: 0; margin: 4px 0 0; }
      .item-card .affixes li {
        border-top: 1px solid var(--line);
        padding: 4px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: baseline;
        color: var(--text);
      }
      .item-card .affixes li.affix-none { border-top: 0; color: var(--dim); font-size: 11px; }
      .affix-name { font-size: 12px; color: #cfe0ff; }
      .affix-stat { font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #7f8ca8; }
      .affix-range { font-size: 11px; color: #aebbd4; }
      .affix-effective { font-size: 10px; color: var(--accent); }
      .affix-weight { font-size: 10px; color: #5f6b83; }
      .affix-flag { font-size: 10px; color: #ffd28a; }
      .set-block {
        margin: 10px 14px 14px;
        padding: 8px 10px;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .set-block h3 { font-size: 13px; margin: 0 0 6px; }
      .set-pieces { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
      .set-piece {
        font-size: 11px;
        color: #cfe0ff;
        background: #151b2b;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
      }
      .set-piece.current { border-color: var(--accent); color: var(--accent); }
      .set-tier {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: baseline;
        padding: 2px 0;
        font-size: 11px;
        color: var(--dim);
      }
      .set-tier.off { opacity: 0.55; }
      .set-tier b { color: var(--accent); font-weight: 600; min-width: 34px; }
      .set-tier-effects { color: #ffd28a; font-size: 10px; }
      .monster-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; }
      .monster-head .icon { width: 52px; height: 52px; }
      .skill-line { padding: 6px 14px 0; color: var(--accent); font-size: 12px; }
      .skill-row.flash { background: #1a2740; border-radius: 8px; transition: background 0.3s; }
      .path-skills { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 10px 14px 0; }
      .path-skills button { font-size: 12px; padding: 3px 10px; }
      .path-skill { display: flex; align-items: baseline; gap: 8px; text-align: left; }
      .path-skill-name { flex: none; }
      .path-skill-desc { color: var(--dim); font-size: 10px; line-height: 14px; }
      .range-canvas {
        flex: none;
        max-width: 99px;
        image-rendering: pixelated;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0a0c12;
      }
      .range-legend {
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: 9px;
        line-height: 12px;
        color: var(--dim);
      }
      .range-swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 4px;
        border-radius: 2px;
        vertical-align: -1px;
      }
      .range-note { color: #7d879c; }
      .skill-fx {
        flex: none;
        width: 104px;
        height: 104px;
        display: block;
        background: #06070b;
        border: 1px solid var(--line);
        border-radius: 6px;
        image-rendering: pixelated;
      }
      .skill-fx-none {
        flex: none;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        font-size: 10px;
        border: 1px dashed var(--line);
        border-radius: 6px;
      }
      .path-card { padding-bottom: 12px; }
      .monster-page { display: flex; flex-direction: column; gap: 26px; }
      .monster-danger-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .monster-danger-label { color: var(--dim); font-size: 12px; }
      .monster-danger-select {
        background: #0f1220;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .monster-danger-select:hover,
      .monster-danger-select:focus { border-color: var(--accent); outline: none; }
      .monster-danger-hint { color: var(--dim); font-size: 11px; }
      .monster-body { display: flex; flex-direction: column; gap: 26px; }
      .section-title { font-size: 17px; margin: 0 0 4px; }
      .section-note { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
      /* 武器 / 奇物页：标题 + 计数 + 详情折叠按钮同排，不额外占首屏 */
      .item-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 0 0 4px; }
      .item-toolbar .section-title { margin: 0; }
      .item-toolbar .item-count { color: var(--dim); font-size: 11px; }
      .item-toolbar .filter-chip { margin-left: auto; padding: 2px 12px; }
      .item-detail { display: contents; }
      .details-collapsed .item-detail { display: none; }
      .monster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
      .monster-card { display: flex; flex-direction: column; }
      .monster-head h2 { margin: 0; font-size: 15px; }
      .monster-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .monster-id {
        color: var(--dim);
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        margin-left: 8px;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        white-space: nowrap;
      }
      .monster-sub { color: var(--accent); font-size: 12px; }
      .monster-card .stat-row { margin: 10px 14px 0; flex-wrap: wrap; }
      .monster-card .stat-cell { flex: 1 1 54px; }
      .monster-desc { padding: 0 14px; }
      .scale-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 10px 14px 14px;
        margin-top: auto;
        border-top: 1px solid var(--line);
      }
      .scale-label { color: var(--dim); font-size: 11px; }
      .scale-item {
        font-size: 11px;
        color: #aebbd4;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 7px;
      }
      .stat-values { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
      .boost-value { color: #ffd28a; font-weight: 700; }
      .boost-tag {
        display: inline-block;
        vertical-align: middle;
        color: #ffd28a;
        background: #241a33;
        border: 1px solid #5a3780;
        border-radius: 4px;
        padding: 0 4px;
        font-size: 9px;
        line-height: 1.6;
        white-space: nowrap;
      }
      .boss-card { background: #1b1426; border-color: #5a3780; }
      .boss-grid { grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); }
      .boss-card .monster-head .icon { width: 96px; height: 96px; object-fit: contain; }
      .boss-card .boss-phases { margin-top: 0; padding-top: 4px; border-top: 0; }
      .pool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; }
      .pool-card { padding-bottom: 10px; }
      .pool-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px 0;
      }
      .pool-head h2 { font-size: 15px; margin: 0; }
      .pool-head .monster-id { margin-left: 6px; }
      .pool-planets { color: var(--dim); font-size: 11px; text-align: right; }
      .pool-list { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 14px 0; }
      .pool-item {
        position: relative;
        width: 92px;
        min-height: 126px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 10px 6px 8px;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: center;
      }
      .pool-item .icon { width: 48px; height: 48px; object-fit: contain; }
      .pool-item b { font-size: 12px; font-weight: 600; line-height: 1.3; }
      .pool-item .monster-id { margin: 0; font-size: 10px; border: 0; background: none; padding: 0; }
      .pool-item .pool-stats { color: var(--dim); font-size: 10px; line-height: 1.3; }
      .pool-boss { width: 132px; background: #241830; border-color: #7b4ba8; padding-top: 24px; }
      .pool-boss .icon { width: 64px; height: 64px; }
      .badge-boss {
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        background: #8f4fd4;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.05em;
        border-radius: 4px;
        padding: 1px 6px;
      }
      .pool-note { color: var(--dim); font-size: 11px; margin: 10px 14px 0; }
      /* NPC 页：内容表联动 + 主角同屏对比 */
      .npc-page { display: flex; flex-direction: column; gap: 22px; }
      .npc-page-note { color: var(--dim); font-size: 12px; margin: 0; }
      .npc-lineup {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      .npc-lineup .section-title { font-size: 16px; margin: 0 0 4px; }
      .npc-lineup .section-note { margin: 0 0 12px; }
      .npc-lineup-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        background: #0a0c12;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .npc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; }
      .npc-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 2px solid var(--accent);
        border-radius: 12px;
        padding: 14px;
      }
      .npc-head { display: flex; align-items: center; gap: 12px; }
      .npc-head .npc-thumb {
        image-rendering: pixelated;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 2px;
        flex: none;
      }
      .npc-title { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .npc-title h2 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
      .npc-id {
        color: var(--dim);
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        white-space: nowrap;
      }
      .npc-sprite { color: var(--accent); font-size: 11px; }
      .npc-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .npc-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        min-width: 0;
