<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生成工具 · 时间特工</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d14;
        --panel: #141824;
        --line: #242b3d;
        --text: #dbe4f5;
        --dim: #7f8ca8;
        --accent: #6ec8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 14px;
      }
      h1 { font-size: 20px; margin: 0; }
      .hint { color: var(--dim); font-size: 12px; }
      button {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.active { border-color: var(--accent); color: var(--accent); background: #16202e; }
      #tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .paths {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .card canvas:not(.icon) { display: block; width: 100%; height: auto; image-rendering: pixelated; }
      .meta, .item-card { padding: 12px 14px 14px; }
      .meta h2, .card > h2 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
      .item-card { padding: 14px; }
      .item-head { display: flex; justify-content: space-between; align-items: baseline; }
      .item-head h2 { font-size: 15px; margin: 0; }
      .energy { color: var(--accent); font-size: 12px; }
      .tags { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
      .desc, .unique p { color: var(--dim); font-size: 12px; margin: 2px 0 0; }
      .unique {
        border-left: 2px solid var(--accent);
        padding-left: 8px;
        margin: 10px 0;
      }
      .unique strong { font-size: 12px; color: #ffd28a; }
      .affixes, .passives { margin: 8px 0 0; padding-left: 16px; color: var(--dim); font-size: 12px; }
      .rules { margin: 0 0 10px; padding-left: 16px; color: var(--dim); font-size: 12px; }
      .swatches { display: flex; gap: 3px; }
      .swatches i { width: 14px; height: 14px; border-radius: 3px; display: block; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
      .tabs { display: flex; gap: 6px; margin-top: 8px; }
      .tabs button { padding: 3px 10px; font-size: 12px; }
      .tabs button.active { border-color: var(--accent); color: var(--accent); }
      .stat-row { display: flex; gap: 8px; margin-top: 10px; }
      .stat-cell {
        flex: 1;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
      }
      .stat-danger { color: var(--dim); font-size: 10px; }
      .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 14px; }
      .domain-card { padding-bottom: 10px; }
      .icon { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
      .skill-title { display: flex; align-items: center; gap: 6px; }
      .skill-title .icon { width: 24px; height: 24px; }
      .item-head { display: flex; align-items: center; gap: 8px; }
      .monster-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; }
      .monster-head .icon { width: 52px; height: 52px; }
      .skill-line { padding: 6px 14px 0; color: var(--accent); font-size: 12px; }
      .skill-row.flash { background: #1a2740; border-radius: 8px; transition: background 0.3s; }
      .path-skills { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 0; }
      .path-skills button { font-size: 12px; padding: 3px 10px; }
      .skill-list { padding: 0 14px; }
      .skill-row { border-top: 1px solid var(--line); padding: 8px 0; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
      .skill-text { flex: 1 1 180px; min-width: 0; }
      .range-canvas {
        flex: none;
        width: 110px;
        height: 90px;
        image-rendering: pixelated;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0a0c12;
      }
      .skill-fx {
        flex: none;
        width: 200px;
        height: 130px;
        display: block;
        background: #06070b;
        border: 1px solid var(--line);
        border-radius: 8px;
        image-rendering: pixelated;
      }
      .skill-fx-none {
        flex: none;
        width: 200px;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        font-size: 11px;
        border: 1px dashed var(--line);
        border-radius: 8px;
      }
      .skill-row b { font-size: 13px; }
      .skill-meta { display: block; color: var(--accent); font-size: 11px; }
      .skill-row p { color: var(--dim); font-size: 12px; margin: 2px 0 0; }
      .path-card { padding-bottom: 12px; }
    </style>
    <script type="module" crossorigin src="./assets/tools-CMZvQDxg.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/effect-DH1auV-A.js">
    <link rel="modulepreload" crossorigin href="./assets/icons-CqzakWr_.js">
  </head>
  <body>
    <header>
      <h1>生成工具</h1>
      <span class="hint">坐标 = 时间码 + 星球（大风格）+ 遗迹（核心地形）+ 种子</span>
      <button id="reroll">换一批</button>
      <a href="/fx.html" style="color: #6ec8f0; text-decoration: none; font-size: 12px">特效台 →</a>
    </header>
    <nav id="tabs"></nav>
    <div id="view"></div>
  </body>
</html>
