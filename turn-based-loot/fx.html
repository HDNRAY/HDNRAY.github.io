<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>特效台 · 时间特工</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d14;
        --panel: #141824;
        --line: #242b3d;
        --text: #dbe4f5;
        --dim: #7f8ca8;
        --accent: #6ec8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 22px 24px 40px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      h1 { font-size: 20px; margin: 0; }
      .hint { color: var(--dim); font-size: 12px; }
      a { color: var(--accent); text-decoration: none; font-size: 12px; }
      .wrap {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .stage {
        flex: 1 1 620px;
        min-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .col-timeline { flex: 0 0 300px; }
      .col-panel { flex: 0 0 360px; }
      canvas {
        display: block;
        background: #06070b;
        border: 1px solid var(--line);
        border-radius: 12px;
        image-rendering: pixelated;
        width: 100%;
        max-width: 780px;
        height: auto;
      }
      .transport {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .time { margin-left: auto; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; }
      .sec {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px 12px;
      }
      .sec h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--dim);
        text-transform: uppercase;
      }
      button, select {
        background: #1a2030;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 10px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover, select:hover { border-color: var(--accent); color: var(--accent); }
      button:active { transform: translateY(1px); }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .row label { width: 76px; flex: none; color: var(--dim); font-size: 12px; }
      .row output { width: 46px; flex: none; text-align: right; color: var(--accent); font-size: 12px; }
      input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
      input[type="color"] {
        width: 46px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: none;
        cursor: pointer;
      }
      .colors { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
      .colors .row { margin-bottom: 0; }
      .colors > button { align-self: flex-start; margin-top: 4px; }
      .swatch-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
      .swatch { display: flex; gap: 3px; }
      .swatch i { width: 12px; height: 12px; border-radius: 3px; display: block; }
      .layers {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: max(280px, calc(100vh - 300px));
        overflow: auto;
      }
      .layer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 11px;
        color: var(--dim);
      }
      .layer-row:hover { background: #10141f; }
      .layer-row.active { border-color: var(--accent); background: #16202e; }
      .layer-name { width: 52px; flex: none; color: var(--text); }
      .layer-track { position: relative; flex: 1; height: 8px; background: #0f1220; border-radius: 4px; overflow: hidden; }
      .layer-track i { position: absolute; top: 0; bottom: 0; border-radius: 4px; opacity: 0.9; }
      .layer-time { width: 42px; flex: none; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
      .layer-del { padding: 0 7px; font-size: 12px; line-height: 18px; border-radius: 4px; }
      .layer-anchor {
        flex: none;
        font-size: 10px;
        color: var(--accent);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        line-height: 16px;
      }
      .add-row { display: flex; gap: 8px; margin-top: 8px; }
      .add-row select { flex: 1; }
      .params { max-height: max(260px, calc(100vh - 560px)); overflow: auto; }
      .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
      .buttons + .buttons { margin-top: 8px; }
      .checks { display: flex; gap: 14px; font-size: 12px; color: var(--dim); }
      details { margin-top: 8px; }
      summary { cursor: pointer; color: var(--dim); font-size: 12px; }
      textarea.json {
        width: 100%;
        height: 190px;
        margin-top: 8px;
        padding: 8px;
        background: #0f1220;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        resize: vertical;
      }
      @media (max-width: 1360px) {
        .wrap { flex-wrap: wrap; }
        .col-timeline,
        .col-panel { flex: 1 1 320px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/fx-BsPjDlUM.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/effect-CVPleg5L.js">
  </head>
  <body>
    <header>
      <h1>特效台</h1>
      <span class="hint">效果 = 图层数组；每层 = 图元 + 出现时间 + 存活 + 参数</span>
      <a href="/tools.html">← 生成工具</a>
    </header>
    <div class="wrap">
      <div class="stage">
        <canvas id="preview" width="780" height="540"></canvas>
        <div id="transport" class="transport"></div>
      </div>
      <div id="timeline" class="col col-timeline"></div>
      <div id="panel" class="col col-panel"></div>
    </div>
  </body>
</html>
